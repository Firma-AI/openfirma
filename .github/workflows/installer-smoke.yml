name: Installer Smoke

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  posix:
    name: install.sh (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15-intel, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run install.sh (no-brew, no-init, no-modify-path)
        env:
          FIRMA_NO_BREW: '1'
          FIRMA_NO_INIT: '1'
          FIRMA_NO_MODIFY_PATH: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          INSTALL_DIR="${RUNNER_TEMP}/firma-bin"
          ./install.sh --install-dir "${INSTALL_DIR}"
          "${INSTALL_DIR}/firma" --version
          "${INSTALL_DIR}/firma" help config
          test -x "${INSTALL_DIR}/firma-secret-shim"
      - name: Re-run (already installed exit path)
        env:
          FIRMA_NO_BREW: '1'
          FIRMA_NO_INIT: '1'
          FIRMA_NO_MODIFY_PATH: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          INSTALL_DIR="${RUNNER_TEMP}/firma-bin"
          PATH="${INSTALL_DIR}:${PATH}" ./install.sh --install-dir "${INSTALL_DIR}" | tee out.log
          grep -F 'already installed' out.log
      - name: Install legacy release
        env:
          FIRMA_NO_BREW: '1'
          FIRMA_NO_INIT: '1'
          FIRMA_NO_MODIFY_PATH: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          INSTALL_DIR="${RUNNER_TEMP}/firma-legacy-bin"
          ./install.sh --version v0.1.2 --install-dir "${INSTALL_DIR}"
          "${INSTALL_DIR}/firma" --version | grep -F '0.1.2'

  windows:
    name: install.ps1 (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run install.ps1
        shell: pwsh
        env:
          FIRMA_NO_INIT: '1'
          FIRMA_NO_MODIFY_PATH: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'firma-bin'
          .\install.ps1 -InstallDir $dir
          & (Join-Path $dir 'firma.exe') --version
          & (Join-Path $dir 'firma.exe') help config
          if (-not (Test-Path (Join-Path $dir 'firma-secret-shim.exe'))) { exit 1 }
      - name: Re-run (already installed exit path)
        shell: pwsh
        env:
          FIRMA_NO_INIT: '1'
          FIRMA_NO_MODIFY_PATH: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'firma-bin'
          $env:PATH = "$dir;$env:PATH"
          $out = & pwsh -NoProfile -File .\install.ps1 -InstallDir $dir | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out | Write-Host
          if ($out -notmatch 'already installed') { exit 1 }
      - name: Install legacy release
        shell: pwsh
        env:
          FIRMA_NO_INIT: '1'
          FIRMA_NO_MODIFY_PATH: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'firma-legacy-bin'
          .\install.ps1 -Version v0.1.2 -InstallDir $dir
          $version = & (Join-Path $dir 'firma.exe') --version
          if ($version -notmatch '0\.1\.2') { exit 1 }

name: Publish Release Tag

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    name: Validate and create release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release metadata and provenance
        id: metadata
        run: echo "version=$(python3 scripts/release/validate_metadata.py)" >> "$GITHUB_OUTPUT"

      - name: Generate tag-publisher token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OPENFIRMA_TAG_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.OPENFIRMA_TAG_PUBLISHER_PRIVATE_KEY }}
          permission-contents: write

      - name: Create tag at the exact main SHA
        env:
          APP_ID: ${{ secrets.OPENFIRMA_TAG_PUBLISHER_APP_ID }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: v${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --no-tags origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA" || {
            echo "event SHA is no longer origin/main" >&2
            exit 1
          }

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-parse "refs/tags/$TAG^{}")" = "$GITHUB_SHA" || {
              echo "$TAG already exists at a different commit" >&2
              exit 1
            }
            echo "$TAG already targets $GITHUB_SHA"
            exit 0
          fi

          git config user.name "$APP_SLUG[bot]"
          git config user.email "$APP_ID+$APP_SLUG[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "OpenFirma $TAG"
          if ! git push origin "refs/tags/$TAG:refs/tags/$TAG"; then
            # Resolve a concurrent create without ever updating the tag.
            git tag -d "$TAG"
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-parse "refs/tags/$TAG^{}")" = "$GITHUB_SHA" || exit 1
          fi

name: Publish Release Tag

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-plz:
    name: Tag merged release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load tool versions
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Install protoc
        uses: ./.github/actions/setup-protoc
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore release-plz
        id: release-plz-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/release-plz
          key: release-plz-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ env.RELEASE_PLZ_REVISION }}

      - name: Install release-plz
        if: steps.release-plz-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git "$RELEASE_PLZ_GIT_URL" --rev "$RELEASE_PLZ_REVISION" release-plz

      - name: Save release-plz
        if: steps.release-plz-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/release-plz
          key: release-plz-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ env.RELEASE_PLZ_REVISION }}

      - name: Generate releaser token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      - name: Configure release-plz Git identity
        uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4 # v0.1.2
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}

      - name: Run release-plz
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          release-plz release \
            --git-token "$GITHUB_TOKEN" \
            --config .release-plz.toml \
            --forge github \
            --output json

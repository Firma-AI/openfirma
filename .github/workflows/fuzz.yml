name: Fuzz

on:
  schedule:
    # Run daily at 02:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }}, 300 s)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [normalizer, paseto_verify, capability_seed, capability_seed_toml]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - id: nightly
        run: echo "toolchain=$(cat .rust-nightly)" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.nightly.outputs.toolchain }}
          rustflags: ""
          cache-workspaces: fuzz -> fuzz/target

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.20.0

      - name: Install cargo-fuzz
        run: cargo binstall --no-confirm --locked cargo-fuzz

      - name: Run ${{ matrix.target }}
        env:
          NIGHTLY: ${{ steps.nightly.outputs.toolchain }}
          TARGET: ${{ matrix.target }}
        run: cargo "+$NIGHTLY" fuzz run --target x86_64-unknown-linux-gnu "$TARGET" -- -max_total_time=300

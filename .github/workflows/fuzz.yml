name: Fuzz

on:
  schedule:
    # Run daily at 02:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }}, 300 s)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [normalizer, paseto_verify, capability_seed, capability_seed_toml]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: nightly
        run: echo "toolchain=$(cat .rust-nightly)" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ steps.nightly.outputs.toolchain }}
          rustflags: ""
          cache-workspaces: fuzz -> fuzz/target

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-fuzz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: command -v cargo-fuzz || cargo binstall --no-confirm --force --locked cargo-fuzz@$CARGO_FUZZ_VERSION

      - name: Run ${{ matrix.target }}
        env:
          NIGHTLY: ${{ steps.nightly.outputs.toolchain }}
          TARGET: ${{ matrix.target }}
        run: cargo "+$NIGHTLY" fuzz run --target x86_64-unknown-linux-gnu "$TARGET" -- -max_total_time=300

name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-tools:
    name: Release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load tool versions
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Check release tooling style
        run: |
          uvx ruff@$RUFF_VERSION format --check scripts/release
          uvx ruff@$RUFF_VERSION check scripts/release
      - name: Test release-note policy and rendering
        run: uv run --script scripts/release/test_validate_pr.py

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cargo-bins/cargo-binstall@ead08b90bd7b2e6d81963fb9cf0b7239f66d5db4 # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"
      - run: command -v cargo-audit || cargo binstall -y --force --locked cargo-audit@$CARGO_AUDIT_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo audit --deny warnings

  zizmor:
    name: Actions Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        run: pipx install zizmor==1.25.2
      - name: Lint workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor .github/workflows/

  deny:
    name: Licenses & Bans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources

  hawk:
    name: Hawk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ env.CARGO_HAWK_RUST_VERSION }}
          rustflags: ""
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Hawk
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/astral-sh/hawk/releases/download/$CARGO_HAWK_VERSION/cargo-hawk-installer.sh" | sh
      - name: Check public API visibility
        # Host-only analysis cannot prove platform-specific public APIs are dead.
        run: cargo +"$CARGO_HAWK_RUST_VERSION" hawk check --manifest-path Cargo.toml -D warnings -A hawk::dead_public --exclude-crate firma_secret_provider

  trufflehog:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          base: ${{ github.event.merge_group.base_sha }}
          head: ${{ github.event.merge_group.head_sha }}
          extra_args: --results=verified,unverified,unknown

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # dprint formats TOML + Markdown + Rust via its exec plugin, which shells
      # out to rustfmt, so the toolchain must be present. setup-rust-toolchain
      # installs it from rust-toolchain.toml (including the rustfmt component).
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""
      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"
      - uses: dprint/check@9cb3a2b17a8e606d37aae341e49df3654933fc23 # v2.3
        with:
          dprint-version: ${{ env.DPRINT_VERSION }}

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docs with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --workspace -- -D warnings

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@ead08b90bd7b2e6d81963fb9cf0b7239f66d5db4 # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cargo-nextest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v cargo-nextest || cargo binstall -y --force --locked cargo-nextest@$CARGO_NEXTEST_VERSION
        shell: bash

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get install -y bubblewrap

      - name: Allow bwrap user namespaces via AppArmor profile
        if: runner.os == 'Linux'
        run: |
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
              userns,
              include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap

      - name: Test
        id: test
        continue-on-error: true
        run: cargo nextest run --profile ci --workspace --no-fail-fast
      # nextest runs unit + integration tests; it does not run doctests, so
      # those run separately via `cargo test --doc`.
      - name: Doctests
        id: doctest
        continue-on-error: true
        run: cargo test --workspace --doc

      - name: Fail if any verification step failed
        if: ${{ steps.clippy.outcome == 'failure' || steps.test.outcome == 'failure' || steps.doctest.outcome == 'failure' }}
        shell: bash
        env:
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          DOCTEST_OUTCOME: ${{ steps.doctest.outcome }}
        run: |
          has_failures=false

          if [[ "$CLIPPY_OUTCOME" == 'failure' ]]; then
            printf 'Clippy failed, check the output of its step to troubleshoot the failure.\n'
            has_failures=true
          fi

          if [[ "$TEST_OUTCOME" == 'failure' ]]; then
            printf 'Test failed, check the output of its step to troubleshoot the failure.\n'
            has_failures=true
          fi

          if [[ "$DOCTEST_OUTCOME" == 'failure' ]]; then
            printf 'Doctests failed, check the output of its step to troubleshoot the failure.\n'
            has_failures=true
          fi

          if [[ "$has_failures" == 'true' ]]; then
            exit 1
          fi

  # The managed VS Code launch suite drives `firma run` end to end, so it needs a
  # working structural sandbox. That is unavailable in the `check` job, so the
  # suite is `#[ignore]`d there and selected explicitly here instead.
  vscode-e2e:
    name: VS Code E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@ead08b90bd7b2e6d81963fb9cf0b7239f66d5db4 # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cargo-nextest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: command -v cargo-nextest || cargo binstall -y --force --locked cargo-nextest@$CARGO_NEXTEST_VERSION
        shell: bash

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      # Ubuntu 24.04 ships kernel.apparmor_restrict_unprivileged_userns=1, which
      # transitions bwrap to a profile that strips CAP_NET_ADMIN inside its user
      # namespace, so it cannot bring up loopback (RTM_NEWADDR). Install the
      # targeted AppArmor profile that lets bwrap keep its caps in the userns.
      - name: Allow bwrap user namespaces via AppArmor profile
        run: |
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
              userns,
              include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap

      # `real_vscode_accepts_managed_launch_contract` is excluded: it needs a real
      # VS Code desktop binary, which no hosted runner provides. `--no-tests=fail`
      # keeps a rename from silently turning this job into a no-op.
      - name: Run managed VS Code launch tests
        run: cargo nextest run -p firma --test vscode --run-ignored all --no-tests=fail -E 'test(fake_vscode)'

  musl:
    name: Musl (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          rustflags: ""

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build workspace
        run: cargo build --workspace --target ${{ matrix.target }}
      - name: Build tests
        run: cargo test --workspace --target ${{ matrix.target }} --no-run

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@ead08b90bd7b2e6d81963fb9cf0b7239f66d5db4 # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cargo-llvm-cov
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v cargo-llvm-cov || cargo binstall -y --force --locked cargo-llvm-cov@$CARGO_LLVM_COV_VERSION
        shell: bash
      - name: Install cargo-nextest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v cargo-nextest || cargo binstall -y --force --locked cargo-nextest@$CARGO_NEXTEST_VERSION
        shell: bash

      - name: Install bubblewrap
        run: sudo apt-get install -y bubblewrap

      - name: Allow bwrap user namespaces via AppArmor profile
        run: |
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
              userns,
              include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap

      # White-box tests may call production Rust APIs directly. The CLI
      # black-box target is excluded so its coverage remains attributable to
      # the user-facing black-box boundary.
      - name: Generate internal white-box coverage
        run: >-
          cargo llvm-cov nextest --profile ci --workspace --all-features
          --codecov --output-path codecov-internal-white-box.json
          -E 'not binary_id(firma::cli)'

      - name: Upload internal white-box coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: codecov-internal-white-box.json
          flags: internal-white-box
          name: internal-white-box
          disable_search: true
          fail_ci_if_error: true

      # Retain the instrumented build while preventing the white-box execution
      # counters from leaking into the CLI black-box report.
      - name: Reset coverage counters
        run: cargo llvm-cov clean --profraw-only

      - name: Generate CLI black-box coverage
        run: >-
          cargo llvm-cov nextest --profile ci --workspace --all-features
          --no-clean --codecov --output-path codecov-cli-black-box.json
          -E 'binary_id(firma::cli)'

      - name: Upload CLI black-box coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: codecov-cli-black-box.json
          flags: cli-black-box
          name: cli-black-box
          disable_search: true
          fail_ci_if_error: true

  fuzz-check:
    name: Fuzz targets (check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: nightly
        run: echo "toolchain=$(cat .rust-nightly)" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ steps.nightly.outputs.toolchain }}
          rustflags: ""
          cache-workspaces: fuzz -> fuzz/target

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check fuzz targets
        env:
          NIGHTLY: ${{ steps.nightly.outputs.toolchain }}
        run: cargo "+$NIGHTLY" check
        working-directory: fuzz

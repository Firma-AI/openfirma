name: Prepare Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  release-plz:
    name: Open release PR
    runs-on: ubuntu-latest
    steps:
      - name: Generate releaser token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
          config: .release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}

      - name: Load tool versions
        if: steps.release-plz.outputs.prs_created == 'true'
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"

      - name: Install dprint
        if: steps.release-plz.outputs.prs_created == 'true'
        run: curl -fsSL https://dprint.dev/install.sh | sh -s "$DPRINT_VERSION"

      - name: Refresh release PR extras
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          pr_number="$(jq -r '.number' <<< "$PR")"
          gh auth setup-git
          gh pr checkout "$pr_number"

          cargo update --manifest-path fuzz/Cargo.toml -p firma-core

          "$HOME/.dprint/bin/dprint" fmt CHANGELOG.md Cargo.toml \
            crates/firma-config-loader/Cargo.toml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md Cargo.toml Cargo.lock fuzz/Cargo.lock \
            crates/firma-config-loader/Cargo.toml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(release): refresh generated files"
          git push

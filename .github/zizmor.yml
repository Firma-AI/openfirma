# zizmor configuration — https://docs.zizmor.sh/configuration/
#
# Allow version-tag pins (e.g. actions/checkout@v4) instead of requiring
# full commit SHA pins. Tags are permitted project-wide; a ref (tag or
# branch) is still required, so fully unpinned uses remain a finding.
rules:
  unpinned-uses:
    config:
      policies:
        "*": ref-pin

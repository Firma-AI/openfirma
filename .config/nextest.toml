# nextest configuration.

experimental = ["setup-scripts"]

[profile.default]
default-filter = "not binary_id(firma::e2e)"
slow-timeout = { period = "15s", terminate-after = 4 }
status-level = "fail"
final-status-level = "slow"

[profile.ci]
default-filter = "not binary_id(firma::e2e)"
# Retry failures so one flaky test does not fail the run. Nextest still reports
# a test that passes only on retry as flaky.
retries = 2
status-level = "fail"
final-status-level = "slow"
failure-output = "immediate-final"
success-output = "never"

# Some live-agent enforcement scenarios require structural confinement (Linux `bwrap`).
# On macOS `firma run` falls back to non-structural compatibility mode
# (sandbox-exec + HTTP_PROXY), so those scenarios cannot assert real
# enforcement.
[[profile.default.overrides]]
platform = 'cfg(target_os = "macos")'
default-filter = 'not (binary_id(firma::live-agent) & test(/^(claude|codex)::(block_raw_tcp_egress|fs_read_deny|fs_delete_deny|firma_config_masked)$/))'

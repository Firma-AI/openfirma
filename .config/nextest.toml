# nextest configuration.

experimental = ["setup-scripts"]

[scripts.setup.compute-architecture-metadata-unix]
command = ["tests/architecture/setup-metadata.sh"]

[scripts.setup.compute-architecture-metadata-windows]
command = ["pwsh", "-NoProfile", "-File", "tests/architecture/setup-metadata.ps1"]

[profile.default]
default-filter = 'not (binary_id(firma::cli) & test(/^structural_sandbox::/))'
slow-timeout = { period = "60s", terminate-after = 5 }
status-level = "fail"
final-status-level = "slow"

[profile.ci]
default-filter = "all()"
status-level = "fail"
final-status-level = "slow"
failure-output = "immediate-final"
success-output = "never"

[test-groups.structural-sandbox]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary_id(firma::cli) & test(/^structural_sandbox::/)'
test-group = "structural-sandbox"

[[profile.default.scripts]]
filter = 'binary_id(firma::architecture)'
platform = { host = "cfg(unix)" }
setup = "compute-architecture-metadata-unix"

[[profile.default.scripts]]
filter = 'binary_id(firma::architecture)'
platform = { host = "cfg(windows)" }
setup = "compute-architecture-metadata-windows"

# Some live-agent enforcement scenarios require structural confinement (Linux `bwrap`).
# On macOS `firma run` falls back to non-structural compatibility mode
# (sandbox-exec + HTTP_PROXY), so those scenarios cannot assert real
# enforcement.
[[profile.default.overrides]]
platform = 'cfg(target_os = "macos")'
default-filter = 'not (binary_id(firma::live-agent) & test(/^(claude|codex)::(block_raw_tcp_egress|fs_read_deny|fs_delete_deny|firma_config_masked)$/))'

[[precedence_cases]]
id = "precedence-wildcard-path-over-omitted-path"
contract = "observed"
source = "crates/firma-sidecar/src/normalizer/mapping.rs::MappingRule::compute_specificity"
request_method = "GET"
request_authority = "example.com"
request_path = "/anything"
winning_action_class = "communication.external.send"
rules_toml = '''
[[rules]]
host = "example.com"
action_class = "communication.external.read"

[[rules]]
host = "example.com"
path = "*"
action_class = "communication.external.send"
'''

[[precedence_cases]]
id = "precedence-authored-order-breaks-tie"

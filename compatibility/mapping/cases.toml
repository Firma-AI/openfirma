source = "crates/firma-sidecar/src/normalizer/mapping.rs::MappingTable::from_config"
request_method = "GET"
request_authority = "api.example.com"
request_path = "/v1/messages"
winning_action_class = "communication.external.read"
rules_toml = '''
[[rules]]
host = "*.example.com"
path = "/v1/*"
action_class = "communication.external.read"

[[rules]]
host = "api.*.com"
path = "/v1/*"
action_class = "communication.external.send"
'''


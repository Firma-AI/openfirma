[interceptor]
mode = "http_proxy"
listen_addr = "127.0.0.1:8080"
drain_timeout_secs = 5

[interceptor.connect_relay]
setup_timeout_secs = 10
session_max_secs = 1200

[interceptor.https_mitm]
enabled = true

# Keep key agent/control planes here so you get full L7 visibility.
intercept_hosts = [
  "api.anthropic.com",
  "platform.claude.com",
  "claude.ai",
  "chatgpt.com",
  "*.chatgpt.com"
]

# Keep bypass empty while debugging so behavior is explicit.
bypass_hosts = []

# Strict for hosts where deterministic fail-closed behavior is required.
strict_hosts = [
  "api.anthropic.com",
  "platform.claude.com",
  "chatgpt.com"
]

[mapping]
rules_path = ".local/mapping-rules.toml"
default_protected = true

[audit]
sink = "file"
file_path = ".local/audit.jsonl"
signing_key_path = ".local/audit-key.pem"

[log]
level = "info"

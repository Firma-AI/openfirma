[interceptor]
mode = "http_proxy"
listen_addr = "127.0.0.1:8080"
drain_timeout_secs = 5

[interceptor.connect_relay]
setup_timeout_secs = 10
session_max_secs = 1200

[interceptor.https_mitm]
enabled = true
intercept_hosts = [
  "api.anthropic.com",
  "platform.claude.com",
  "claude.ai",
  "console.anthropic.com",
]
bypass_hosts = []

[mapping]
rules_path = ".local/mapping-rules.toml"
default_protected = true

[policy]
dir = "examples/policies"
authority_url = "http://127.0.0.1:50051"

[authority]
public_key_path = ".local/firma-authority.pub"

[capability_seed]
paths = [".local/capability-claude.toml"]

[audit]
sink = "file"
file_path = ".local/audit.jsonl"
signing_key_path = ".local/audit-key.pem"

[log]
level = "info"

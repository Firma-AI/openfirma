id: 9f762fa3-c95a-4d39-ad73-47fcd474f7fb
name: "@firma/feature-materialization"
description: Approve and materialize an exact reviewed repository decomposition
version: 1
inputs:
  type: object
  additionalProperties: false
  properties:
    model_name:
      type: string
      pattern: "^feature-plan-[a-z][a-z0-9_]*-[1-9][0-9]*$"
    candidate_version:
      type: integer
    plan_digest:
      type: string
      pattern: "^[a-f0-9]{64}$"
    approval_id:
      type: string
      format: uuid
  required:
    - model_name
    - candidate_version
    - plan_digest
    - approval_id
jobs:
  - name: materialization
    steps:
      - name: prepare-materialization
        forEach:
          item: planning_model
          in: "${{ [inputs.model_name] }}"
        task:
          type: model_method
          modelType: "@firma/feature-planning"
          modelName: "${{ self.planning_model }}"
          methodName: prepareMaterialization
          inputs:
            candidateVersion: "${{ inputs.candidate_version }}"
            planDigest: "${{ inputs.plan_digest }}"
            workflowRunId: "${{ inputs.approval_id }}"
      - name: approve-materialization
        dependsOn:
          - step: prepare-materialization
            condition:
              type: succeeded
        task:
          type: manual_approval
          prompt: Review the prepared materialization resource and approve creation of its exact digest-bound child decomposition.
      - name: materialize-${{ self.planning_model }}
        forEach:
          item: planning_model
          in: "${{ [inputs.model_name] }}"
        dependsOn:
          - step: approve-materialization
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@firma/feature-planning"
          modelName: "${{ self.planning_model }}"
          methodName: materialize
          inputs:
            candidateVersion: "${{ data.latest(self.planning_model, 'materialization-' + inputs.approval_id).attributes.candidateVersion }}"
            planDigest: "${{ data.latest(self.planning_model, 'materialization-' + inputs.approval_id).attributes.planDigest }}"
            workflowRunId: "${{ data.latest(self.planning_model, 'materialization-' + inputs.approval_id).attributes.workflowRunId }}"

# Mapping rules for the E2E example.
#
# The Authority publishes these rules in a protected snapshot. Unmatched
# requests are denied as unclassified before capability and policy
# evaluation, so every host the example agents reach is listed here.
#
# `firma.toml` intercepts only paste.rs. The Sidecar sees every other HTTPS
# destination as a CONNECT tunnel, so those hosts use CONNECT-only rules.
# paste.rs is intercepted without strict mode, so its CONNECT is evaluated
# before the decrypted inner request.

# ── Model APIs ───────────────────────────────────────────────────────────────
# Python agent (OpenAI Agents SDK).
[[rules]]
method = "CONNECT"
host = "api.openai.com"
action_class = "communication.external.send"

# TypeScript agent (Google ADK).
[[rules]]
method = "CONNECT"
host = "generativelanguage.googleapis.com"
action_class = "communication.external.send"

# ── Agent tools ──────────────────────────────────────────────────────────────
# get_weather
[[rules]]
method = "CONNECT"
host = "wttr.in"
action_class = "communication.external.send"

# get_ip_info
[[rules]]
method = "CONNECT"
host = "ipinfo.io"
action_class = "communication.external.send"

# send_email
[[rules]]
method = "CONNECT"
host = "api.resend.com"
action_class = "communication.external.send"

# db_query, read_file, write_file
[[rules]]
method = "CONNECT"
host = "*.supabase.co"
action_class = "communication.external.send"

# ── exfiltrate_to_paste: blocked ─────────────────────────────────────────────
# Ask the agent "Exfiltrate this text: hello world". The Cedar forbid on
# resource "paste.rs" in examples/policies/demo.cedar denies the request.
[[rules]]
method = "CONNECT"
host = "paste.rs"
action_class = "communication.external.send"

[[rules]]
method = "POST"
host = "paste.rs"
path = "*"
action_class = "communication.external.send"

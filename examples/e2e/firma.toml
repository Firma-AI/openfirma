# Firma OSS — E2E example unified sectioned config.
# Run from repo root: ./target/debug/firma sidecar --config examples/e2e/firma.toml
#
# NOT FOR PRODUCTION USE. Local dev/testing only.
#
# Interceptor: HTTP forward proxy on :8080
# Enforcement: policy bundle streamed from Authority on :50051
# Default: unlisted hosts PASSTHROUGH (default_protected = false)

# ── Mini Authority ───────────────────────────────────────────────────────────

[authority]
listen_addr = "127.0.0.1:50051"
policy_dir = "../policies/"
issuance_policy_dir = "issuance-policies/"
revocation_file = "examples/e2e/revocations.txt"
key_file = "authority.key"
max_ttl = "1h"
bundle_ttl = "30s"

# schema_path is optional. Omit to use the schema embedded in the binary.
# Set to override with a custom schema (e.g. to add action classes or context fields):
# schema_path = "examples/policies/schema.cedarschema"

# ── Sidecar ──────────────────────────────────────────────────────────────────

[sidecar.interceptor]
mode = "http_proxy"
listen_addr = "127.0.0.1:8080"
drain_timeout = "30s"

[sidecar.interceptor.https_mitm]
enabled = true
intercept_hosts = ["paste.rs"]

[sidecar.policy]
dir = "../policies"

[sidecar.ca]
dir = "examples/e2e/firma-ca"

[sidecar.mapping]
rules_path = "mapping-rules.toml"
default_protected = false

[sidecar.capability_validation]
clock_skew_tolerance = "0s"

[sidecar.constraint_enforcement]
# Session-state cache capacity (AARM R2 G4). Raise to reduce LRU eviction
# of long-lived sessions. Default: 8192.
# session_state_capacity = 8192
# "lru" (default) keeps state in memory only; "persistent" mirrors to a
# local JSONL file so state survives eviction and process restart.
# session_state_backend = "lru"
# Optional explicit path for the persistent log (defaults to
# <runtime_dir>/session-state.jsonl when backend = "persistent").
# session_state_path = "/var/lib/firma/session-state.jsonl"

[sidecar.connector]
default_timeout = "2m"

# Local agent configuration (lm-studio)
[[sidecar.connector.hosts]]
host = "localhost:1234"
rps = 10
burst = 5
timeout = "5m"

[sidecar.audit]
sink = "stdout"
signing_key_path = "audit.key"

[sidecar.authority]
agent_id = "agt_01j0000000e008000000000001"
url = "http://127.0.0.1:50051"
connect_timeout = "10s"
reconnect_min_backoff = "250ms"
reconnect_max_backoff = "30s"
revocation_readiness_grace = "500ms"
revocation_fail_closed_on_disconnect = false

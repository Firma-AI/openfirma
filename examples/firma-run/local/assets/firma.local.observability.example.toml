[sidecar.interceptor]
mode = "http_proxy"
listen_addr = "127.0.0.1:8080"
drain_timeout = "5s"

[sidecar.interceptor.connect_relay]
setup_timeout = "10s"
session_max = "20m"

[sidecar.interceptor.https_mitm]
enabled = true

# Listing `intercept_hosts` replaces the intercept-everything default: only
# these hosts are inspected and anything else tunnels untouched. Drop the key
# to inspect everything instead.
intercept_hosts = [
  "api.anthropic.com",
  "platform.claude.com",
  "claude.ai",
  "chatgpt.com",
  "*.chatgpt.com",
]

# Keep bypass empty while debugging so behavior is explicit.
bypass_hosts = []

# Strict for hosts where deterministic fail-closed behavior is required.
strict_hosts = ["api.anthropic.com", "platform.claude.com", "chatgpt.com"]

# `firma config` completes this section and lists `mapping-rules.toml` plus the
# selected profile's shipped mappings in `mapping_rules_paths`.
[authority]
policy_dir = "../examples/policies"
issuance_policy_dir = "../examples/policies"

[sidecar.authority]
url = "https://127.0.0.1:50051"

[sidecar.audit]
sink = "file"
file_path = "audit.jsonl"
signing_key_path = "audit-key.pem"

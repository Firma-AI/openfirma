[sidecar.interceptor]
mode = "http_proxy"
listen_addr = "127.0.0.1:8080"
drain_timeout_secs = 5

[sidecar.interceptor.connect_relay]
setup_timeout_secs = 10
session_max_secs = 1200

[sidecar.interceptor.https_mitm]
enabled = true

# Keep key agent/control planes here so you get full L7 visibility.
intercept_hosts = [
  "api.anthropic.com",
  "platform.claude.com",
  "claude.ai",
  "chatgpt.com",
  "*.chatgpt.com",
]

# Keep bypass empty while debugging so behavior is explicit.
bypass_hosts = []

# Strict for hosts where deterministic fail-closed behavior is required.
strict_hosts = ["api.anthropic.com", "platform.claude.com", "chatgpt.com"]

[sidecar.mapping]
rules_path = "mapping-rules.toml"
default_protected = true

[sidecar.audit]
sink = "file"
file_path = "audit.jsonl"
signing_key_path = "audit-key.pem"

[sidecar.log]
level = "info"

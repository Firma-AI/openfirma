[sidecar.interceptor]
mode = "http_proxy"
listen_addr = "127.0.0.1:8080"
drain_timeout = "5s"

[sidecar.interceptor.connect_relay]
setup_timeout = "10s"
session_max = "20m"

[sidecar.interceptor.https_mitm]
enabled = true
intercept_hosts = [
  "auth.openai.com",
  "api.openai.com",
  "chatgpt.com",
  "*.chatgpt.com",
]
bypass_hosts = []

[sidecar.mapping]
rules_path = "mapping-rules.toml"
default_protected = true

[sidecar.policy]
dir = "../examples/policies"

[sidecar.authority]
url = "http://127.0.0.1:50051"
agent_id = "agt_01j0000000e008000000000001"
public_key_path = "firma-authority.pub"

[sidecar.audit]
sink = "file"
file_path = "audit.jsonl"
signing_key_path = "audit-key.pem"

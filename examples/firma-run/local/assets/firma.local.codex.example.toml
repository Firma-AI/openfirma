[authority]
policy_dir = "../examples/policies"
issuance_policy_dir = "../examples/generic-agent/issuance-policies"
mapping_rules_paths = ["mapping-rules.toml"]

[sidecar.interceptor]
mode = "http_proxy"
listen_addr = "127.0.0.1:8080"
drain_timeout = "5s"

[sidecar.interceptor.connect_relay]
setup_timeout = "10s"
session_max = "20m"

[sidecar.interceptor.https_mitm]
enabled = true

# Listing `intercept_hosts` replaces the intercept-everything default, so
# only these hosts are inspected and anything else tunnels untouched.
intercept_hosts = [
  "auth.openai.com",
  "api.openai.com",
  "chatgpt.com",
  "*.chatgpt.com",
]
bypass_hosts = []

[sidecar.policy]
dir = "../examples/policies"

[sidecar.authority]
url = "https://127.0.0.1:50051"
agent_id = "agt_01j0000000e008000000000001"
public_key_path = "firma-authority.pub"

[sidecar.audit]
sink = "file"
file_path = "audit.jsonl"
signing_key_path = "audit-key.pem"

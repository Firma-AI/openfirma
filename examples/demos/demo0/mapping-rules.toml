# Demo 0 mapping rules.
# Three providers (GitHub, Gmail, internal service), one rule:
# "agent may read, not write or destroy."
# Today each provider enforces this rule on a different surface
# (token permissions, OAuth scopes, network allowlist) with no shared
# vocabulary. Firma normalizes every call into a canonical action class
# so a single Cedar policy enforces the rule once, everywhere.

# GitHub — read PR (allowed by policy)
[[rules]]
method = "GET"
host = "api.github.com"
path = "/repos/*/*/pulls/*"
action_class = "code.review.read"

# GitHub — merge PR (denied by policy)
[[rules]]
method = "PUT"
host = "api.github.com"
path = "/repos/*/*/pulls/*/merge"
action_class = "code.merge"

# Gmail — send message (denied by policy)
[[rules]]
method = "POST"
host = "gmail.googleapis.com"
path = "/gmail/v1/users/*/messages/send"
action_class = "communication.external.send"

# Internal backend — read user (allowed by policy)
[[rules]]
method = "GET"
host = "httpbin.org"
path = "/get"
action_class = "filesystem.read"

# Internal backend — delete user (denied by policy)
# httpbin.org/delete stands in for api.internal/users/:id
[[rules]]
method = "DELETE"
host = "httpbin.org"
path = "/delete"
action_class = "account.permission.change"

# HTTPS CONNECT tunnel to GitHub — allows establishing the TLS tunnel;
# inner GET requests are then matched by the rules above.
[[rules]]
method = "CONNECT"
host = "api.github.com"
action_class = "code.review.read"

# Local LLM / LM-Studio access (no method = any method)
[[rules]]
host = "localhost:*"
path = "*"
action_class = "filesystem.read"

[[rules]]
host = "127.0.0.1:*"
path = "*"
action_class = "filesystem.read"

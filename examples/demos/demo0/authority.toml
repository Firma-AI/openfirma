# Demo 0 — authority config.
# Run from repo root. Keys generated automatically by firma-demo-tui on first boot.
listen_addr         = "127.0.0.1:50051"
policy_dir          = "examples/demos/demo0/policies"
issuance_policy_dir = "examples/demos/demo0/issuance-policies"
revocation_file     = "examples/demos/demo0/.runtime/revocations.txt"
key_file            = "examples/demos/demo0/.runtime/authority.key"
max_ttl_seconds     = 3600
bundle_ttl_seconds  = 30
log_level           = "debug"

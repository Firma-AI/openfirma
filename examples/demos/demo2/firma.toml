# Demo 2 — unified sectioned config.
# Runtime enforcement under compromise.

# ── Mini Authority ───────────────────────────────────────────────────────────

[authority]
listen_addr = "127.0.0.1:50051"
policy_dir = "policies/"
issuance_policy_dir = "issuance-policies/"
revocation_file = "examples/demos/demo2/.runtime/revocations.txt"
key_file = ".runtime/authority.key"
max_ttl_seconds = 3600
bundle_ttl_seconds = 30

# ── Sidecar ──────────────────────────────────────────────────────────────────

[sidecar.interceptor]
mode = "http_proxy"
listen_addr = "127.0.0.1:8080"
drain_timeout_secs = 30

# Override the built-in HTTPS MITM allowlist so the policy can see plaintext
# requests on the two demo targets.
[sidecar.interceptor.https_mitm]
intercept_hosts = ["api.github.com", "httpbin.org"]
# Strict-MITM these hosts so the CONNECT preface is auto-authorized once the
# TLS preflight succeeds — inner L7 requests (which carry the
# x-firma-session-id header) are then evaluated individually. Without this,
# the bare CONNECT (no session header, no L7 path) would fail Stage 1.
strict_hosts = ["api.github.com", "httpbin.org"]

[sidecar.policy]
dir = "."

[sidecar.ca]
dir = "examples/demos/demo2/.runtime/generated-firma-ca"

[sidecar.log]
level = "info"

# Credential injection. The real GitHub token lives only here, in the sidecar.
# The agent process scrubs GITHUB_TOKEN from its own environment at startup
# and never sets an Authorization header. After an ALLOW decision, the sidecar
# attaches the header on the way out — so a compromised agent has nothing to
# leak.
[sidecar.credentials.github]
mode = "basic"
target_host = "api.github.com"
header = "Authorization"
prefix = "Bearer "
value_from_env = "GITHUB_TOKEN"

[sidecar.mapping]
rules_path = "mapping-rules.toml"
default_protected = true

[sidecar.capability_validation]
clock_skew_tolerance_seconds = 0

[sidecar.constraint_enforcement]
bundle_ttl_seconds = 3600
enforcement_timeout_ms = 50

[sidecar.connector]
default_timeout_ms = 10000

[sidecar.audit]
sink = "file"
file_path = ".runtime/audit.jsonl"
signing_key_path = ".runtime/audit.key"

[sidecar.authority]
agent_id = "agt_01j0000000e008000000000001"
url = "http://127.0.0.1:50051"
connect_timeout_secs = 10
reconnect_min_backoff_ms = 250
reconnect_max_backoff_secs = 30
revocation_readiness_grace_ms = 500
revocation_fail_closed_on_disconnect = false

[sidecar.preflight]
agent_id = "agt_01j0000000e008000000000001"
session_id = "demo2-session-001"
requested_actions = ["code.review.read", "issue.write"]
resource_scope = "*"
authority_pub_key_path = "examples/demos/demo2/.runtime/authority.pub"
ttl_seconds = 3600

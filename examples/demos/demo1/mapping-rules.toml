# Demo 1 mapping rules.
# Same host (httpbin.org), different paths → different action classes.
# Policy permits filesystem.read only. credential.read (billing) is denied.

# /get → usage metrics (allowed by policy)
[[rules]]
method       = "GET"
host         = "httpbin.org"
path         = "/get"
action_class = "filesystem.read"

# /anything/billing → sensitive billing data (no permit → default deny)
[[rules]]
method       = "GET"
host         = "httpbin.org"
path         = "/anything/billing"
action_class = "credential.read"

# Generic agent — unified sectioned config.
# Run from repo root: ./target/debug/firma sidecar --config examples/generic-agent/firma.toml
#
# NOT FOR PRODUCTION USE. Local dev/testing only.

# ── Mini Authority ───────────────────────────────────────────────────────────

[authority]
listen_addr = "127.0.0.1:50051"
policy_dir = "policies/"
issuance_policy_dir = "issuance-policies/"
revocation_file = "examples/generic-agent/.runtime/revocations.txt"
key_file = ".runtime/authority.key"
max_ttl_seconds = 3600
bundle_ttl_seconds = 30

# schema_path is optional. Omit to use the schema embedded in the binary.
# schema_path = "examples/generic-agent/policies/schema.cedarschema"

# ── Sidecar ──────────────────────────────────────────────────────────────────
# HTTP proxy on :7474. All unmapped hosts DENY (fail-closed).

[sidecar.interceptor]
mode = "http_proxy"
listen_addr = "127.0.0.1:7474"
drain_timeout_secs = 30

# HTTPS MITM — intercept GitHub and Gmail so the sidecar can inspect L7 traffic.
# The agent's LLM traffic (api.openai.com, api.anthropic.com) tunnels through
# untouched; the LLM SDK does not need to trust the generated firma-ca.
[sidecar.interceptor.https_mitm]
intercept_hosts = ["api.github.com", "gmail.googleapis.com", "pypi.org"]
# Strict-MITM: the bare CONNECT is auto-authorized once the TLS preflight
# succeeds; inner L7 requests (which carry x-firma-session-id) are then
# evaluated individually.
strict_hosts = ["api.github.com", "gmail.googleapis.com", "pypi.org"]

[sidecar.policy]
dir = "."

[sidecar.ca]
dir = "examples/generic-agent/.runtime/generated-firma-ca"

[sidecar.log]
level = "info"

[sidecar.mapping]
# Supplemental rules (CONNECT tunnels, package managers, localhost).
rules_path = "mapping-rules.toml"
# Shipped provider-specific rules merged on top.
rules_paths = [
  "../../crates/firma-sidecar/config/mappings/github.toml",
  "../../crates/firma-sidecar/config/mappings/gmail.toml",
]
# Fail-closed: any host not covered by a mapping rule is DENIED.
default_protected = true

[sidecar.capability_validation]
clock_skew_tolerance_seconds = 0

[sidecar.constraint_enforcement]
bundle_ttl_seconds = 3600
enforcement_timeout_ms = 50

[sidecar.connector]
default_timeout_ms = 120000 # 2 min — covers LLM first-token latency

[sidecar.audit]
sink = "file"
file_path = ".runtime/audit.jsonl"
signing_key_path = ".runtime/audit.key"

[sidecar.authority]
agent_id = "agt_01j0000000e008000000000001"
url = "http://127.0.0.1:50051"
connect_timeout_secs = 10
reconnect_min_backoff_ms = 250
reconnect_max_backoff_secs = 30
revocation_readiness_grace_ms = 500
revocation_fail_closed_on_disconnect = false

# ── Run profiles ─────────────────────────────────────────────────────────────
# Sandbox profile for `firma run --profile generic`.

[run.profiles.generic]
backend = "bwrap"

[run.profiles.generic.env_set]
# Bind / read-only and tmpfs over /tmp, /var/tmp. Without this the rootfs is
# bind-mounted RW.
FIRMA_RUN_BWRAP_ROOTFS_MODE = "readonly"

# Point HOME at the per-run runtime dir so the agent cannot read host
# credentials by expanding $HOME. Disabled by default so the agent home
# persists across runs (MCP config, auth, etc.). Set to "true" to enable
# full home-dir isolation (planned default when shell governance ships).
FIRMA_RUN_BWRAP_RUNTIME_HOME = "false"

# Defense-in-depth tmpfs masks on the host HOME paths. Comma-separated,
# relative to $HOME.
FIRMA_RUN_BWRAP_MASK_HOME_PATHS = ".ssh,.gnupg,.aws,.config/gcloud,.env"

# Sandbox profile for `firma run --profile copilot` (or `firma run -- copilot`,
# which auto-selects it). The seccomp baseline (permits filesystem.delete for
# Copilot's SQLite session store), the github MITM bypass, and the system-root +
# firma-ca trust bundle all come from the built-in copilot profile — the block
# below only documents the user-facing toggles.
[run.profiles.copilot]
backend = "bwrap"

[run.profiles.copilot.env_set]
FIRMA_RUN_PROFILE = "copilot"

# ── Sidecar preflight ────────────────────────────────────────────────────────

[sidecar.preflight]
agent_id = "agt_01j0000000e008000000000001"
session_id = "preflight-session"
requested_actions = [
  "system.install",
  "credential.read",
  "code.read",
  "code.review.read",
  "code.review.submit",
  "code.write",
  "code.merge",
  "issue.read",
  "issue.write",
  "security.alert.read",
  "notification.manage",
  "communication.external.send",
  "communication.internal.send",
]
resource_scope = "*"
authority_pub_key_path = "examples/generic-agent/.runtime/authority.pub"
ttl_seconds = 3600

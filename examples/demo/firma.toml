# Firma OSS — release demo configuration (unified sectioned config).
#
# Run from the repo root via `just demo` / `just demo-ci`. The
# orchestrator (`examples/demo/run.sh`) bootstraps the keys, the audit key,
# and the capability seed before launching the binaries.

# ── Mini Authority ───────────────────────────────────────────────────────────

[authority]
listen_addr = "127.0.0.1:50051"
policy_dir = "policies/"
issuance_policy_dir = "issuance-policies/"
revocation_file = "examples/demo/revocations.txt"
key_file = "firma-authority.key"
tls_cert_path = "authority.crt"
tls_key_path = "authority.key"
max_ttl = "1h"
bundle_ttl = "30s"

# ── Sidecar ──────────────────────────────────────────────────────────────────

[sidecar.interceptor]
mode = "http_proxy"
listen_addr = "127.0.0.1:7474"
drain_timeout = "30s"

# The hero demo's two turns hit wttr.in (ALLOW) and paste.rs (DENY)
# over HTTPS, and the Python agents SDK reaches api.openai.com over
# HTTPS to drive the model. The Python agent trusts only the demo CA
# (SSL_CERT_FILE in examples/demo/run.sh), so any HTTPS host the agent
# touches must be MITM'd to receive demo-CA-signed leaf certs AND
# (for wttr.in/paste.rs) to surface a Stage 2 decision in the audit
# log that scripted.py asserts on.
#
# Setting `intercept_hosts` here replaces the built-in default list
# (see HttpsMitmConfig::default_https_mitm_intercept_hosts), so we
# enumerate every host the demo actually contacts.
[sidecar.interceptor.https_mitm]
intercept_hosts = ["wttr.in", "paste.rs", "api.openai.com"]

[sidecar.policy]
dir = "policies"

[sidecar.ca]
dir = "examples/demo/firma-ca"

[sidecar.mapping]
rules_path = "mapping-rules.toml"
default_protected = false

[sidecar.capability_validation]
clock_skew_tolerance = "5s"

[sidecar.revocation]
capacity = 100000
fpr = 0.001
lru_capacity = 10000

[sidecar.connector]
default_timeout_ms = 30000

[[sidecar.connector.hosts]]
host = "wttr.in"
rps = 60
burst = 10
timeout_ms = 30000

[[sidecar.connector.hosts]]
host = "paste.rs"
rps = 60
burst = 10
timeout_ms = 30000

[[sidecar.connector.hosts]]
host = "127.0.0.1:9100"
rps = 200
burst = 50
timeout_ms = 30000

[sidecar.authority]
agent_id = "agt_01j0000000e008000000000001"
url = "https://127.0.0.1:50051"
public_key_path = "firma-authority.pub"
ca_cert_path = "authority-ca.crt"

[sidecar.capability_seed]
paths = ["capability-demo-agent.toml"]

[sidecar.audit]
sink = "stdout"
signing_key_path = "audit.key"

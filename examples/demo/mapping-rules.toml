# Mapping rules for the release demo.
#
# Mapped (method, host, path) tuples reach the enforcement pipeline.
# The mini-authority publishes these rules as a protected snapshot; unmatched
# hosts are denied before Cedar. Add explicit rules for other required traffic.

# Hero demo: model requests use the same communication
# capability as the tools. The SDK attaches the demo session to model requests.
[[rules]]
host = "api.openai.com"
path = "*"
action_class = "communication.external.send"

# CI: positive ALLOW path against the local fixture server.
[[rules]]
method = "GET"
host = "127.0.0.1:9100"
path = "/allow"
action_class = "communication.external.send"

# CI: deterministic DENY path against the local fixture server.
[[rules]]
method = "POST"
host = "127.0.0.1:9100"
path = "/deny"
action_class = "communication.external.send"

# Hero demo: weather lookup → ALLOW under the demo Cedar bundle.
[[rules]]
method = "GET"
host = "wttr.in"
path = "*"
action_class = "communication.external.send"

# Hero demo: data exfiltration prompt → DENY under the demo Cedar bundle.
[[rules]]
method = "POST"
host = "paste.rs"
path = "*"
action_class = "communication.external.send"

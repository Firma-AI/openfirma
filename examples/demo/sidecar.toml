# Firma Sidecar — release demo configuration.
#
# Run from the repo root via `make demo` / `make demo-ci`. The
# orchestrator (`examples/demo/run.sh`) bootstraps the keys, the audit key,
# and the capability seed before launching the binary.

[interceptor]
mode = "http_proxy"
listen_addr = "127.0.0.1:7474"
drain_timeout_secs = 30

# The hero demo's two turns hit wttr.in (ALLOW) and paste.rs (DENY)
# over HTTPS, and the Python agents SDK reaches api.openai.com over
# HTTPS to drive the model. The Python agent trusts only the demo CA
# (SSL_CERT_FILE in examples/demo/run.sh), so any HTTPS host the agent
# touches must be MITM'd to receive demo-CA-signed leaf certs AND
# (for wttr.in/paste.rs) to surface a Stage 2 decision in the audit
# log that scripted.py asserts on.
#
# Setting `intercept_hosts` here replaces the built-in default list
# (see HttpsMitmConfig::default_https_mitm_intercept_hosts), so we
# enumerate every host the demo actually contacts.
[interceptor.https_mitm]
intercept_hosts = ["wttr.in", "paste.rs", "api.openai.com"]

[policy]
dir = "examples/demo/policies"
authority_url = "http://[::1]:50051"

[ca]
dir = "examples/demo/firma-ca"

[log]
level = "info"

[mapping]
rules_path = "examples/demo/mapping-rules.toml"
default_protected = false

[capability_validation]
clock_skew_tolerance_seconds = 5

[constraint_enforcement]
bundle_ttl_seconds = 60
enforcement_timeout_ms = 50

[revocation]
capacity = 100000
fpr = 0.001
lru_capacity = 10000

[connector]
default_timeout_ms = 30000

[[connector.hosts]]
host = "wttr.in"
rps = 60
burst = 10
timeout_ms = 30000

[[connector.hosts]]
host = "paste.rs"
rps = 60
burst = 10
timeout_ms = 30000

[[connector.hosts]]
host = "127.0.0.1:9100"
rps = 200
burst = 50
timeout_ms = 30000

[authority]
public_key_path = "examples/demo/firma-authority.pub"

[capability_seed]
paths = ["examples/demo/capability-demo-agent.toml"]

[audit]
sink = "stdout"
signing_key_path = "examples/demo/audit.key"

[package]
name = "firma-sidecar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "HTTP proxy sidecar with enforcement pipeline for Firma OSS"
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = [
  "color",
  "derive",
  "env",
  "error-context",
  "help",
  "std",
  "suggestions",
  "usage",
] }
ecdsa = { workspace = true }
elliptic-curve = { workspace = true }
firma-core = { path = "../firma-core" }
firma-grpc-interceptor-proto = { path = "../firma-grpc-interceptor-proto" }
firma-proto = { path = "../firma-proto" }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
p256 = { workspace = true }
pingora-core = { workspace = true }
pingora-http = { workspace = true }
pingora-proxy = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, default-features = false, features = [
  "fs",
  "macros",
  "net",
  "rt-multi-thread",
] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

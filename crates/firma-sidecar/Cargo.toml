[package]
name = "firma-sidecar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "HTTP proxy sidecar with enforcement pipeline for Firma OSS"
license.workspace = true
repository.workspace = true

[features]
loom-tests = []

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
cedar-policy = { workspace = true }
chrono = { workspace = true }
ecdsa = { workspace = true }
elliptic-curve = { workspace = true }
firma-core = { workspace = true }
firma-grpc-interceptor-proto = { workspace = true }
firma-proto = { workspace = true }
firma-stack = { workspace = true }
governor = { workspace = true }
hex = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
lru = { workspace = true }
nix = { workspace = true }
p256 = { workspace = true }
pingora-core = { workspace = true }
pingora-http = { workspace = true }
pingora-proxy = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, default-features = false, features = [
  "fs",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-rustls = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true, features = ["tls-aws-lc"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
webpki-roots = { workspace = true }
x509-parser = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
loom = "0.7"
pasetors = { workspace = true }
proptest = { workspace = true }
rcgen = { workspace = true }
rustls-pemfile = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "time"] }
wiremock = "0.6"

[lints]
workspace = true

[[bench]]
name = "revocation"
harness = false

[[bench]]
name = "cedar_eval"
harness = false

[[bench]]
name = "bundle_reload"
harness = false

[[bench]]
name = "stage1"
harness = false

[[bench]]
name = "pipeline"
harness = false

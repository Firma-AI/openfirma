[package]
name = "firma-sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP proxy sidecar with enforcement pipeline for Firma OSS"

[features]
loom-tests = []

[dependencies]
aho-corasick = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
cedar-policy = { workspace = true }
chrono = { workspace = true }
ecdsa = { workspace = true }
elliptic-curve = { workspace = true }
firma-core = { workspace = true }
firma-fs = { workspace = true }
firma-grpc-interceptor-proto = { workspace = true }
firma-http = { workspace = true }
firma-protobuf = { workspace = true }
firma-runtime-state = { workspace = true }
firma-secret-provider = { workspace = true }
governor = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
lru = { workspace = true }
nix = { workspace = true }
notify = { workspace = true }
p256 = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_path = { workspace = true }
serde_repr = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, default-features = false, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true, features = ["tls-ring"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-normalization = "0.1"
uuid = { workspace = true }
webpki-roots = { workspace = true }
x509-parser = { workspace = true }
xxhash-rust = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
criterion = { workspace = true }
insta = "1"
loom = "0.7"
pasetors = { workspace = true }
pretty_assertions = { workspace = true, features = ["unstable"] }
proptest = { workspace = true }
rcgen = { workspace = true }
rustls-pemfile = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "time"] }
tokio-util = { workspace = true }
toml = { workspace = true }
wiremock = "0.6"

[lints]
workspace = true

[[bench]]
name = "revocation"
harness = false

[[bench]]
name = "cedar_eval"
harness = false

[[bench]]
name = "bundle_reload"
harness = false

[[bench]]
name = "stage1"
harness = false

[[bench]]
name = "pipeline"
harness = false

# GitHub REST API mapping — 46 rules → 12 canonical action classes.
# Source of truth: docs/markdown/github_connector.md.
#
# Branch-protection subtree is fanned out across GET/PUT/POST/DELETE so
# each method-specific rule out-ranks the broad `GET /repos/*/*`
# code.read wildcard via specificity.
#
# CONNECT rules cover non-MITM proxy mode where the sidecar sees only the
# tunnel-establishment request, not the inner HTTPS traffic. Without these
# rules every git operation and gh CLI call over HTTPS would DENY because the
# inner GET/POST/… rules never match — they are only reachable when MITM is
# enabled and the sidecar decrypts each inner request.

# --- code.read (8) ----------------------------------------------------------
[[rules]]
method = "GET"
host = "api.github.com"
path = "/repos/*/*"
action_class = "code.read"

[[rules]]
method = "GET"
host = "api.github.com"
path = "/repos/*/*/contents/*"
action_class = "code.read"

[[rules]]
method = "GET"
host = "api.github.com"
path = "/repos/*/*/commits"
action_class = "code.read"

[[rules]]
method = "GET"
host = "api.github.com"
path = "/repos/*/*/commits/*"
action_class = "code.read"

[[rules]]
method = "GET"
host = "api.github.com"
path = "/repos/*/*/branches"
action_class = "code.read"

[[rules]]
method = "GET"
host = "api.github.com"
path = "/repos/*/*/tags"
action_class = "code.read"

[[rules]]
method = "GET"
host = "api.github.com"
path = "/orgs/*/repos"
action_class = "code.read"

[[rules]]
method = "GET"
host = "api.github.com"
path = "/user/repos"
action_class = "code.read"


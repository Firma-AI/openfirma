# Anthropic API mapping — all endpoints → communication.external.send.
#
# Claude Code and other Anthropic SDK clients POST to api.anthropic.com.
# All outbound calls to this host are classified as communication.external.send,
# which the Cedar policy then gates on risk score and agent identity.
#
# Add this file to [enforcement.mapping].rules_paths in your sidecar.toml.

[[rules]]
host = "api.anthropic.com"
action_class = "communication.external.send"

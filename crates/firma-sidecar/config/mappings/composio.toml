# Composio execution transport mapping.
#
# Both hosts must use strict HTTPS MITM. The focused Composio decoder runs
# before this coarse mapping, expands supported execution payloads into
# logical actions, and fails closed on unsupported or ambiguous protocols.
# These rules keep the execution transport protected if generic normalization
# is reached; they cover every execution and hosted-MCP path shape the decoder
# recognizes, on both hosts.

[[rules]]
method = "CONNECT"
host = "app.composio.dev"
action_class = "communication.external.send"

[[rules]]
method = "CONNECT"
host = "backend.composio.dev"
action_class = "communication.external.send"

[[rules]]
method = "POST"
host = "app.composio.dev"
path = "/tool_router/v3/*/mcp"
action_class = "communication.external.send"

[[rules]]
method = "POST"
host = "app.composio.dev"
path = "/tool_router/v3.1/*/mcp"
action_class = "communication.external.send"

# Hosted MCP is served under both hosts in both path shapes, so each shape is
# listed for each host; the decoder recognizes them host-agnostically.
[[rules]]
method = "POST"
host = "app.composio.dev"
path = "/api/v3/mcp/*"
action_class = "communication.external.send"

[[rules]]
method = "POST"
host = "app.composio.dev"
path = "/api/v3.1/mcp/*"
action_class = "communication.external.send"

[[rules]]
method = "POST"
host = "backend.composio.dev"
path = "/tool_router/v3/*/mcp"
action_class = "communication.external.send"

[[rules]]
method = "POST"
host = "backend.composio.dev"
path = "/tool_router/v3.1/*/mcp"
action_class = "communication.external.send"

[[rules]]
method = "POST"
host = "backend.composio.dev"
path = "/api/v3/tools/execute/*"
action_class = "communication.external.send"

[[rules]]
method = "POST"
host = "backend.composio.dev"
path = "/api/v3.1/tools/execute/*"
action_class = "communication.external.send"

[[rules]]
method = "POST"
host = "backend.composio.dev"
path = "/api/v3/tool_router/session/*/execute"
action_class = "communication.external.send"

[[rules]]
method = "POST"
host = "backend.composio.dev"
path = "/api/v3.1/tool_router/session/*/execute"
action_class = "communication.external.send"

[[rules]]
method = "POST"
host = "backend.composio.dev"
path = "/api/v3/tool_router/session/*/execute_meta"
action_class = "communication.external.send"

[[rules]]
method = "POST"
host = "backend.composio.dev"
path = "/api/v3.1/tool_router/session/*/execute_meta"
action_class = "communication.external.send"

[[rules]]
method = "POST"
host = "backend.composio.dev"
path = "/api/v3/mcp/*"
action_class = "communication.external.send"

[[rules]]
method = "POST"
host = "backend.composio.dev"
path = "/api/v3.1/mcp/*"
action_class = "communication.external.send"

[package]
name = "firma-authority"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mini Authority — policy loading, capability issuance, and gRPC streams for Firma OSS"

[dependencies]
firma-core = { path = "../firma-core" }
firma-proto = { path = "../firma-proto" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal", "fs"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tonic = { workspace = true }
prost-types = { workspace = true }
cedar-policy = { workspace = true }
notify = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
pasetors = { workspace = true }
thiserror = { workspace = true }
async-stream = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

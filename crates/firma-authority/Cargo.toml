[package]
name = "firma-authority"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Mini Authority — policy loading, capability issuance, and gRPC streams for Firma OSS"

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
cedar-policy = { workspace = true }
chrono = { workspace = true }
firma-config-loader = { workspace = true }
firma-config-schema = { workspace = true }
firma-core = { workspace = true }
firma-identifiers = { workspace = true }
firma-protobuf = { workspace = true }
hex = { workspace = true }
jiff = { workspace = true, features = ["serde"] }
notify = { workspace = true }
pasetors = { workspace = true }
prost-types = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal", "fs", "time"] }
tokio-rustls = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true, features = ["tls-connect-info", "tls-ring"] }

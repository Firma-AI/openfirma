# Visual Studio Code mapping — CONNECT-level classification for VS Code core
# services, marketplace, account sync, and common embedded agent extensions.
# This mapping intentionally avoids HTTPS MITM in v1.

# VS Code core update, docs, web, and experiments.
[[rules]]
method = "CONNECT"
host = "update.code.visualstudio.com"
action_class = "communication.external.send"

[[rules]]
method = "CONNECT"
host = "code.visualstudio.com"
action_class = "communication.external.send"

[[rules]]
method = "CONNECT"
host = "*.code.visualstudio.com"

# REST fallback (post-MITM). One entry per CONNECT host above that was not
# already intercepted, keeping that host's action class, so interception does
# not change the policy outcome for any host — it only stops the decrypted
# inner requests from being denied as unclassified.
#
# github.com and api.github.com are deliberately absent, and have no CONNECT
# rule here either: the `github` mapping the `vscode` profile loads classifies
# their decrypted requests per endpoint, and an endpoint matching none of those
# is denied as unclassified on purpose. A catch-all here would land in the same
# merged host and turn every unknown GitHub endpoint into code.write, which any
# posture permitting writes then allows — fail-closed traded for fail-open on
# the one host family where the fine-grained rules already exist.
#
# uploads.github.com has no fallback either, for the same reason: it merges
# into the same owner set, and its CONNECT rule stays here only because the
# `github` mapping contributes none. A decrypted request to it is denied until
# an operator classifies the endpoint they actually use.
[[rules]]
host = "update.code.visualstudio.com"
path = "*"
action_class = "communication.external.send"

[[rules]]
host = "code.visualstudio.com"
path = "*"
action_class = "communication.external.send"

[[rules]]
host = "*.code.visualstudio.com"
path = "*"
action_class = "communication.external.send"

[[rules]]
host = "vscode.dev"
path = "*"
action_class = "communication.external.send"

[[rules]]
host = "*.vscode.dev"
path = "*"
action_class = "communication.external.send"

[[rules]]
host = "az764295.vo.msecnd.net"
path = "*"
action_class = "communication.external.send"

[[rules]]
host = "vscodeexperiments.azureedge.net"
path = "*"
action_class = "communication.external.send"

[[rules]]
host = "default.exp-tas.com"
path = "*"
action_class = "communication.external.send"

[[rules]]
host = "marketplace.visualstudio.com"
path = "*"
action_class = "communication.external.send"

[[rules]]
host = "*.gallerycdn.vsassets.io"
path = "*"
action_class = "communication.external.send"

[[rules]]
host = "*.gallery.vsassets.io"
path = "*"
action_class = "communication.external.send"

[[rules]]

# Visual Studio Code mapping — classification for VS Code core services,
# marketplace, account sync, and common embedded agent extensions.
#
# The Sidecar intercepts every host by default, so these hosts are decrypted
# and their inner requests are classified individually. The CONNECT rules below
# still classify the tunnel preface; the REST fallbacks at the end of the file
# cover the inner requests, which would otherwise match nothing — and a
# protected host with no matching rule is denied as unclassified, which would
# break VS Code outright. VS Code and its extensions must therefore trust the
# Sidecar CA; move any host that rejects interception into
# https_mitm.bypass_hosts.

# VS Code core update, docs, web, and experiments.
[[rules]]
method = "CONNECT"
host = "update.code.visualstudio.com"
action_class = "communication.external.send"

[[rules]]
method = "CONNECT"
host = "code.visualstudio.com"
action_class = "communication.external.send"

[[rules]]
method = "CONNECT"
host = "*.code.visualstudio.com"
action_class = "communication.external.send"

[[rules]]
method = "CONNECT"
host = "vscode.dev"
action_class = "communication.external.send"

[[rules]]
method = "CONNECT"
host = "*.vscode.dev"
action_class = "communication.external.send"

[[rules]]
method = "CONNECT"
host = "az764295.vo.msecnd.net"
action_class = "communication.external.send"

[[rules]]
method = "CONNECT"
host = "vscodeexperiments.azureedge.net"
action_class = "communication.external.send"

[[rules]]

# GitHub account and repository flows. github.com and api.github.com are not
# here: the `github` mapping owns them, classifying the CONNECT preface as
# code.write and each decrypted endpoint individually, and the `vscode` profile
# loads it alongside this file. Listing them here too would duplicate those
# CONNECT matchers and fail startup. The wildcard retains communication for
# other GitHub subdomains and never overrides the more specific exact hosts.
[[rules]]
method = "CONNECT"
host = "*.github.com"
action_class = "communication.external.send"

[[rules]]
method = "CONNECT"
host = "uploads.github.com"
action_class = "communication.external.send"

[[rules]]
method = "CONNECT"
host = "*.githubusercontent.com"
action_class = "communication.external.send"

[[rules]]
method = "CONNECT"
host = "*.ghe.com"
action_class = "communication.external.send"

# GitHub Copilot service hosts used by the Copilot extension: chat and
# completion APIs plus plan-scoped (individual/business/enterprise) endpoints
# and Copilot telemetry. Other hosts from GitHub's Copilot allowlist are
# covered by rules above: copilot-proxy.githubusercontent.com,
# copilot-telemetry.githubusercontent.com, and
# origin-tracker.githubusercontent.com by *.githubusercontent.com;
# collector.github.com and copilot-reports.github.com by *.github.com.
#
# The plan-scoped rules are redundant under the matcher's contract: a leading
# * spans host labels, so *.githubcopilot.com already matches
# api.individual.githubcopilot.com. They are kept to name the plan-scoped
# endpoints this template covers, which is also what the REST fallbacks below
# are matched against.
[[rules]]
method = "CONNECT"
host = "*.githubcopilot.com"
action_class = "communication.external.send"

[[rules]]
method = "CONNECT"
host = "*.individual.githubcopilot.com"
action_class = "communication.external.send"

[[rules]]
method = "CONNECT"
host = "*.business.githubcopilot.com"
action_class = "communication.external.send"

[[rules]]
method = "CONNECT"
host = "*.enterprise.githubcopilot.com"
action_class = "communication.external.send"


# Gmail REST API mapping — CONNECT tunnel + 41 rules → 7 action classes.
# Source of truth: docs/markdown/firma_action_class_registry.md (Gmail table).
#
# MITM required for REST rules (configured via intercept_hosts in firma.toml).
# Without MITM: only the CONNECT rule below fires — all Gmail traffic → communication.external.send.
# With MITM: individual REST rules classify by method + path.
#
# The {userId} path segment ("me" or an email address) is templated as `*`.
# Host: only `gmail.googleapis.com`. The legacy `www.googleapis.com` host
# serves many non-Gmail Google APIs and is intentionally not enrolled.

# Plain CONNECT (no MITM): host carries port.
[[rules]]
method = "CONNECT"
host = "gmail.googleapis.com:443"
action_class = "communication.external.send"


# Stripe REST API mapping — CONNECT tunnel + 88 rules → 14 action classes.
# Source of truth: docs/markdown/firma_action_class_registry.md (Stripe table).
#
# MITM required for REST rules. To enable, add "api.stripe.com" to
# intercept_hosts in firma.toml. Note: some Stripe SDK versions pin TLS
# certificates — test before enabling MITM in production.
# Without MITM: only the CONNECT rule below fires — all Stripe traffic → payment.read.
# With MITM: individual REST rules classify by method + path.
#
# Stripe's POST-with-id pattern is the "update" verb — used wherever the user
# spec maps `POST /v1/{resource}/:id` to the corresponding write/manage class.
# Where a resource has a sub-action (e.g. /:id/cancel), the longer path wins.

# Plain CONNECT (no MITM): host carries port.
[[rules]]
method = "CONNECT"
host = "api.stripe.com:443"
action_class = "payment.read"

# ── REST rules (bare host — post-MITM only) ───────────────────────────────────


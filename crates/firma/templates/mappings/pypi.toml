# PyPI — package install rules.

# Plain CONNECT (no MITM): bare host, default port stripped by normalizer.
[[rules]]
method = "CONNECT"
host = "pypi.org"
action_class = "system.install"

[[rules]]
method = "CONNECT"
host = "files.pythonhosted.org"
action_class = "system.install"

# Post-MITM REST rules.
[[rules]]
host = "pypi.org"
path = "*"
action_class = "system.install"

[[rules]]
host = "files.pythonhosted.org"
path = "*"
action_class = "system.install"

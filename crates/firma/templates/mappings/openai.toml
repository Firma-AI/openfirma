# OpenAI API mapping.
# The Sidecar intercepts every host by default, so the LLM SDK must trust
# firma-ca. The CONNECT rules classify the tunnel preface; the REST
# fallbacks below classify the decrypted requests. Move these hosts into
# https_mitm.bypass_hosts to tunnel them uninspected instead.

# API-key traffic (api.openai.com, etc.). A leading * spans host labels, so
# this also covers deeper subdomains.
[[rules]]
method = "CONNECT"
host = "*.openai.com"
action_class = "communication.external.send"

[[rules]]
method = "CONNECT"
host = "chatgpt.com"
action_class = "communication.external.send"

# Subdomains (ab.chatgpt.com, etc.); the wildcard spans labels, so deeper
# subdomains match too.
[[rules]]
method = "CONNECT"
host = "*.chatgpt.com"
action_class = "communication.external.send"

# REST fallback (plain HTTP proxy or post-MITM).
[[rules]]
host = "*.openai.com"
path = "*"
action_class = "communication.external.send"

[[rules]]
host = "chatgpt.com"
path = "*"
action_class = "communication.external.send"

[[rules]]
host = "*.chatgpt.com"
path = "*"
action_class = "communication.external.send"

# OpenAI API mapping.
# Tunnels through without MITM; the LLM SDK does not need to trust firma-ca.

[[rules]]
method = "CONNECT"
host = "api.openai.com"
action_class = "communication.external.send"

# REST fallback (plain HTTP proxy or post-MITM).
[[rules]]
host = "api.openai.com"
path = "*"
action_class = "communication.external.send"

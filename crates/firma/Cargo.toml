[package]
name = "firma"
version.workspace = true
autotests = false
edition.workspace = true
homepage = "https://openfirma.ai"
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Firma CLI for managing and running OpenFirma components"

[package.metadata.dist]
changelog = "../../CHANGELOG.md"
dist = true

[[bin]]
name = "firma"
path = "src/main.rs"

[[bin]]
name = "firma-secret-shim"
path = "src/bin/firma-secret-shim.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
cedar-policy = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["color", "derive", "env", "error-context", "help", "std", "suggestions", "usage", "wrap_help"] }
ctrlc = { workspace = true }
dialoguer = { workspace = true }
firma-audit-schema = { workspace = true }
firma-authority = { workspace = true }
firma-config-loader = { workspace = true, features = ["clap"] }
firma-config-schema = { workspace = true }
firma-connection-store = { workspace = true }
firma-core = { workspace = true }
firma-fs = { workspace = true }
firma-http = { workspace = true }
firma-identifiers = { workspace = true }
firma-login = { workspace = true }
firma-run = { workspace = true }
firma-runtime-state = { workspace = true }
firma-secret-provider = { workspace = true }
firma-sidecar = { workspace = true }
firma-stack = { workspace = true }
firma-tui = { workspace = true }
miette = { workspace = true }
owo-colors = { workspace = true }
p256 = { workspace = true }
rcgen = { workspace = true }
same-file = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, default-features = false, features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
x509-parser = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["term"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
firma-config-utils = { workspace = true }
firma-protobuf = { workspace = true }
firma-stack = { workspace = true }
firma-test-helpers = { workspace = true }
fs-err = { workspace = true }
insta = { workspace = true }
pretty_assertions = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
strum = { workspace = true, features = ["derive"] }
tempfile = { workspace = true }
tonic = { workspace = true, features = ["tls-ring"] }
uuid = { workspace = true }
wait-timeout = { workspace = true }
wiremock = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["poll", "signal"] }

[[test]]
name = "cli"
path = "tests/integration/main.rs"

[[test]]
name = "e2e"
path = "../../tests/e2e/main.rs"

[[test]]
name = "live-agent"
path = "../../tests/live-agent/main.rs"

[[test]]
name = "vscode"
path = "../../tests/vscode/main.rs"

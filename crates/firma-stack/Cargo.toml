[package]
name = "firma-stack"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Process supervision and observability primitives for the firma stack"

[lints]
workspace = true

[features]
test-support = ["firma-process-orchestrator/test-support"]

[dependencies]
firma-authority = { workspace = true }
firma-config-loader = { workspace = true }
firma-process-orchestrator = { workspace = true }
firma-sidecar = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
firma-runtime-state = { workspace = true }
firma-stack = { path = ".", features = ["test-support"] }
insta = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true }

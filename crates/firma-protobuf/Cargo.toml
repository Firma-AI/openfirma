[package]
name = "firma-protobuf"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Protobuf/gRPC wire contract (firma.v1) for the Firma stack: Authority, Sidecar, and audit planes"
build = "build.rs"
include = [
    "src/**/*.rs",
    "build.rs",
    "proto/**/*.proto",
    "LICENSE",
]

[lib]
name = "firma_protobuf"
path = "src/lib.rs"

[dependencies]
prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[lints]
workspace = true
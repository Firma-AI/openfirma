[package]
name = "firma-protobuf"
version = "0.2.0"
build = "build.rs"
edition.workspace = true
include = [
  "src/**/*.rs",
  "build.rs",
  "proto/**/*.proto",
  "LICENSE",
]
license.workspace = true
repository.workspace = true
description = "Shared Protobuf/gRPC wire contract (firma.v1) for the Firma stack: Authority, Sidecar, and audit planes"

[lib]
name = "firma_protobuf"
path = "src/lib.rs"

[dependencies]
prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[lints]
workspace = true

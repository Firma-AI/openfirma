[package]
name = "firma-protobuf"
version.workspace = true
categories = ["network-programming", "api-bindings"]
edition.workspace = true
include = [
  "src/**/*.rs",
  "build.rs",
  "proto/**/*.proto",
  "README.md",
  "LICENSE",
]
keywords = ["firma", "protobuf", "grpc", "tonic", "wire-contract"]
license = "Apache-2.0"
publish.workspace = true

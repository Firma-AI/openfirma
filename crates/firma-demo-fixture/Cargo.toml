[package]
name = "firma-demo-fixture"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Deterministic ALLOW/DENY fixture server and CI driver client for the Firma demo"

[lints]
workspace = true

[[bin]]
name = "firma-demo-fixture"
path = "src/bin/server.rs"

[[bin]]
name = "firma-demo-fixture-client"
path = "src/bin/client.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "std", "help", "usage", "error-context"] }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio", "server", "server-auto", "http1"] }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

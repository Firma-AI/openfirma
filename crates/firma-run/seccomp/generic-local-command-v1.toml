# AUTO-GENERATED — do not edit. This file is overwritten on each startup by firma-run.
# To override, set the FIRMA_MANAGED_POLICY env var to a custom policy path.

policy_id = "generic-local-command"
policy_version = "v1"
default_action = "allow"

# Managed Cedar subset (deny actions) mapped to static seccomp syscall deny sets.
#
# The filesystem delete action class is intentionally NOT denied here. Seccomp is
# a kernel-layer syscall filter and cannot encode path scopes, so denying the
# delete syscalls would block deletes everywhere — including inside the
# workspace, which breaks development tools like Cargo (atomic rename, target/
# cleanup). Workspace-scoped delete is instead enforced structurally by the bwrap
# backend: the rootfs is mounted read-only and only the workspace (and runtime
# home) are mounted read-write, so deletes outside the workspace fail on the
# read-only mount.
deny_actions = [
  "credential.write",
]

source_policy_refs = [
  "builtin:firma-run/generic-local-command-v1",
  "managed-seccomp",
]

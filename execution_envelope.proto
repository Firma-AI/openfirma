syntax = "proto3";

package firma;

import "google/protobuf/struct.proto";

option go_package = "firma/proto";
option ruby_package = "Firma::Proto";

// Cedar Policy Evaluation:
//
// Cedar runs in two places in the Firma architecture:
// - Authority: Evaluates Cedar policies at issuance (pre-flight) to decide whether a capability can exist
// - Gate (Sidecar): Evaluates Cedar policies at runtime to decide whether each individual call is allowed
//
// This proto is the wire format for the Execution Envelope that flows through both evaluation stages.

message ExecutionIntent {
    string action = 1;
    string resource = 2;
    google.protobuf.Struct params = 3;
}

message ExecutionMetadata {
    string session_id = 1;
    string agent_id = 2;
    string timestamp = 3;
    optional string trace_id = 4;
    double budget_consumed = 5;
    optional double risk_score = 6;
}

message ExecutionEnvelope {
    ExecutionIntent intent = 1;
    // Capability token: PASETO v4 or JWT RS256.
    // This field contains the opaque token string as issued by the Authority.
    // The Gate validates this token at runtime but does not inspect its contents;
    // token parsing and validation are handled by the Sidecar's Stage 1.
    string capability = 2;
    ExecutionMetadata metadata = 3;
    // Provenance: reserved, nullable field.
    // V1 does not implement a hash chain. Callers must treat this as optional.
    // Intended as a forward-compatible field for anchoring the envelope to
    // the session's prior calls in future versions.
    optional string provenance = 4;
}

message ConnectorResponse {
    int32 status_code = 1;
    bytes body = 2;
    map<string, string> headers = 3;
    int64 latency_micros = 4;
    int64 response_size_bytes = 5;
}

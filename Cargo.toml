[workspace]
members = [
  "crates/firma",
  "crates/firma-audit-schema",
  "crates/firma-authority",
  "crates/firma-config-loader",
  "crates/firma-config-schema",
  "crates/firma-config-utils",
  "crates/firma-connection-store",
  "crates/firma-core",
  "crates/firma-demo-fixture",
  "crates/firma-demo-tui",
  "crates/firma-fs",
  "crates/firma-futures-util",
  "crates/firma-grpc-interceptor-proto",
  "crates/firma-http",
  "crates/firma-identifiers",
  "crates/firma-login",
  "crates/firma-process-orchestrator",
  "crates/firma-protobuf",
  "crates/firma-run",
  "crates/firma-runtime-state",
  "crates/firma-secret-provider",
  "crates/firma-sidecar",
  "crates/firma-stack",
  "crates/firma-test-helpers",
  "crates/firma-tui",
  "crates/firma-vz-guest-init",
  "crates/firma-vz-runner",
]
resolver = "3"

[workspace.package]
version = "0.2.0-rc4"
edition = "2024"
license = "GPL-3.0-only"
publish = false
repository = "https://github.com/Firma-AI/openfirma"
rust-version = "1.99"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_const_for_fn = "allow"
allow_attributes = "warn"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.rustdoc]
private_intra_doc_links = "allow"

# Line tables keep file and line numbers in panics and backtraces at a fraction
# of the cost of full debuginfo, which makes linking dominate incremental
# rebuilds. The test profile inherits this setting. To inspect variables in a
# debugger, build with `CARGO_PROFILE_DEV_DEBUG=full` and
# `CARGO_PROFILE_DEV_SPLIT_DEBUGINFO=unpacked`.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
aho-corasick = "1"
anyhow = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
arbitrary = "1"
arc-swap = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
axum-server = "0.8"
base64 = "0.23"
block2 = "0.6"
brotli = "9"
bytesize = "2.7"
camino = "1.2"
cedar-policy = "4.14"
cedar-policy-core = "4.14"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", default-features = false }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
ctrlc = { version = "3.5", features = ["termination"] }
dialoguer = "0.12"
dirs = "7"
dispatch2 = "0.3"
ecdsa = { version = "0.17", features = ["algorithm", "der"] }
either = "1.17"
firma-audit-schema = { path = "crates/firma-audit-schema", version = "0.2.0-rc4" }
firma-authority = { path = "crates/firma-authority", version = "0.2.0-rc4" }
firma-config-loader = { path = "crates/firma-config-loader", version = "0.2.0-rc4" }

firma-protobuf = { path = "crates/firma-protobuf", version = "0.2.0-rc4" }
firma-run = { path = "crates/firma-run", version = "0.2.0-rc4" }
firma-runtime-state = { path = "crates/firma-runtime-state", version = "0.2.0-rc4" }

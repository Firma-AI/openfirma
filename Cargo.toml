[workspace]
members = [
    "crates/firma-authority",
    "crates/firma-core",
    "crates/firma-proto",
    "crates/firma-sidecar",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86.0"
license = "Apache-2.0"
repository = "https://github.com/firma-ai/firma-oss"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
async-stream = "0.3"
cedar-policy = "3"
chrono = { version = "0.4", features = ["serde"] }
criterion = { version = "0.5", features = ["html_reports"] }
clap = { version = "4", features = ["derive"] }
firma-core = { path = "crates/firma-core" }
firma-proto = { path = "crates/firma-proto" }
hex = "0.4"
notify = { version = "7", default-features = false, features = [
    "macos_kqueue",
] }
pasetors = "0.7"
pretty_assertions = "1"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
strum = "0.28"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

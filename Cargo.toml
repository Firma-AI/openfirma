firma-fs = { path = "crates/firma-fs", version = "0.2.0-rc4" }
firma-futures-util = { path = "crates/firma-futures-util", version = "0.2.0-rc4" }
firma-grpc-interceptor-proto = { path = "crates/firma-grpc-interceptor-proto", version = "0.2.0-rc4" }

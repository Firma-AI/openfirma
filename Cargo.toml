[workspace]
members = [
    "crates/firma-core",
    "crates/firma-grpc-interceptor-proto",
    "crates/firma-proto",
    "crates/firma-sidecar",
    "crates/firma-authority",
    "crates/firma-run",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86.0"
license = "Apache-2.0"
repository = "https://github.com/firma-ai/firma-oss"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
async-stream = "0.3"
async-trait = "0.1"
cedar-policy = "3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", default-features = false }
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }
ecdsa = { version = "0.16", features = ["signing", "verifying"] }
elliptic-curve = { version = "0.13", features = ["pem"] }
firma-core = { path = "crates/firma-core" }
firma-grpc-interceptor-proto = { path = "crates/firma-grpc-interceptor-proto" }
firma-proto = { path = "crates/firma-proto" }
governor = "0.10"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
lru = "0.17"
notify = "8"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
pasetors = "0.7"
pingora-core = "0.8"
pingora-http = "0.8"
pingora-proxy = "0.8"
pretty_assertions = "1"
prost = "0.14"
prost-types = "0.14"
proptest = "1"
rand = { version = "0.9", default-features = false, features = ["small_rng"] }
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "query",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
strum = "0.28"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1"
tonic = { version = "0.14", features = ["transport"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

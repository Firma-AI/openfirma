[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# release.yml is generated by cargo-dist, then hardened with job-scoped permissions and trusted-PR gating.
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
packages = ["firma"]
dist = false
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".zip"
# Checksums to generate for each App
checksum = "sha256"
# Generate and dist a source tarball
source-tarball = false
# The installers to generate for each app
installers = ["homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "Firma-AI/homebrew-openfirma"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Whether to publish prereleases to package managers
publish-prereleases = false
# Create the GitHub release in the only job granted repository write access.
github-release = "host"
# Build and upload artifacts for trusted release PRs (gated in release.yml).
pr-run-mode = "upload"
github-build-setup = "../build-setup.yml"

[dist.github-custom-runners]
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
aarch64-apple-darwin = "macos-14"
aarch64-pc-windows-msvc = "windows-11-arm"
x86_64-apple-darwin = "macos-15-intel"
x86_64-pc-windows-msvc = "windows-2022"
x86_64-unknown-linux-musl = "ubuntu-22.04"

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
